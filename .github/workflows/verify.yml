name: Verificar Trameli

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Teste específico do formulário de operação
        run: TRAMELI_UI_TEST=operation-ui.mjs npm run test:ui
      - run: npm run test:ui
      - run: npm audit --omit=dev --audit-level=high
