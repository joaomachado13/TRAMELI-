name: Publicar Trameli

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: trameli-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Conferir configuração pública
        env:
          VITE_SUPABASE_URL: https://rwxwcyerhqcprarjptak.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_2NZu3_raKwWYRkaVPcqzPg_DPEgrn5j
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          [[ "$VITE_SUPABASE_URL" == https://*.supabase.co ]]
          [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]]
      - run: npm ci
      - name: Compilar aplicação
        env:
          VITE_SUPABASE_URL: https://rwxwcyerhqcprarjptak.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_2NZu3_raKwWYRkaVPcqzPg_DPEgrn5j
        run: npm run build -- --mode github-pages
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
