name: Backup criptografado para Google Drive

# Ativação manual até a primeira restauração de teste ser aprovada.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trameli-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
    steps:
      - name: Conferir configuração
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test -n "$BACKUP_AGE_RECIPIENT"
          test -n "$RCLONE_CONFIG_B64"
          [[ "$BACKUP_AGE_RECIPIENT" == age1* ]]

      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age rclone

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Exportar, criptografar e copiar
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "${RUNNER_TEMP}/trameli-backup.XXXXXXXX")"
          out="$work/encrypted"
          mkdir "$out"
          trap 'rm -f "$work/roles.sql" "$work/schema.sql" "$work/data.sql" "$work/auth-data.sql" "$work/history-schema.sql" "$work/history-data.sql" "$work/rclone.conf"' EXIT
          db_url="$(python3 - <<'PY'
          import os
          import re
          from urllib.parse import quote, unquote

          value = os.environ['SUPABASE_DB_URL'].strip()
          match = re.fullmatch(r'(postgres(?:ql)?://[^:/?#]+:)(.*)(@[^@/]+(?::\d+)?/[^?#]+(?:[?#].*)?)', value)
          if not match:
              raise SystemExit('SUPABASE_DB_URL deve ser uma URL Postgres completa.')
          print(f'{match.group(1)}{quote(unquote(match.group(2)), safe="")}{match.group(3)}')
          PY
          )"
          unset SUPABASE_DB_URL
          printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > "$work/rclone.conf"
          chmod 600 "$work/rclone.conf"

          supabase db dump --db-url "$db_url" --role-only --file "$work/roles.sql"
          supabase db dump --db-url "$db_url" --file "$work/schema.sql"
          supabase db dump --db-url "$db_url" --data-only --use-copy -x storage.buckets_vectors -x storage.vector_indexes --file "$work/data.sql"
          supabase db dump --db-url "$db_url" --data-only --use-copy --schema auth --file "$work/auth-data.sql"
          if supabase db dump --db-url "$db_url" --schema supabase_migrations --file "$work/history-schema.sql"; then
            supabase db dump --db-url "$db_url" --data-only --use-copy --schema supabase_migrations --file "$work/history-data.sql"
          else
            printf '%s\n' '-- O banco de origem não possui o schema opcional supabase_migrations.' > "$work/history-schema.sql"
            printf '%s\n' '-- Sem histórico de migrations no banco de origem.' > "$work/history-data.sql"
          fi

          for name in roles schema data auth-data history-schema history-data; do
            test -s "$work/$name.sql"
            age -r "$BACKUP_AGE_RECIPIENT" -o "$out/$name.sql.age" "$work/$name.sql"
            test -s "$out/$name.sql.age"
            rm -f "$work/$name.sql"
          done

          (cd "$out" && sha256sum *.age > SHA256SUMS)
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          remote="gdrive:Trameli/Backups/$stamp"
          rclone --config "$work/rclone.conf" copy "$out" "$remote" --checksum
          rclone --config "$work/rclone.conf" check "$out" "$remote" --checksum --one-way
          echo "Backup criptografado conferido no destino: $remote"
