<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="/"><title>Teste isolado — fotos oficiais</title>
<link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/catalogo.css"><link rel="stylesheet" href="/assets/portal.css">
<link rel="stylesheet" href="/assets/operacao.css">
</head><body><script type="module">
// No credentials, backend, orders or personal browser storage used in this fixture.
import catalog from '/data/client-products.json';
import { withOfficialProductPhoto } from '/src/product-photos.js';
import * as orderMath from '/src/order-math.js';
import { initShopping } from '/src/shopping.js';
window.TrameliTestModules = { initShopping };
window.loadOperationTestModules = async () => {
  window.TrameliFinanceMath = await import('/src/finance-math.js');
  localStorage.setItem('trameli-reduced-motion', 'true');
  await import('/src/motion.js');
  await import('/assets/operacao.js');
  await import('/assets/screens.js');
};
const markup = new DOMParser().parseFromString(await (await fetch('/index.html')).text(), 'text/html');
markup.querySelectorAll('script').forEach(script => script.remove());
document.body.innerHTML = markup.body.innerHTML;
window.TrameliOrderMath = orderMath;
initShopping(null);
window.TrameliProductPhoto = withOfficialProductPhoto;
window.TrameliSourceCatalog = catalog.products.map(withOfficialProductPhoto);
// Exercise the upgrade path: a previously seeded catalog with null images.
localStorage.setItem('trameli-catalog-client-sheet-seeded-v2', 'true');
localStorage.setItem('trameli-catalog-v1', JSON.stringify(catalog.products));
localStorage.removeItem('trameli-portal-cart-v1');
await import('/assets/catalogo.js');
location.hash = '#loja';
await import('/assets/portal.js');
window.photosReady = true;
</script></body></html>
