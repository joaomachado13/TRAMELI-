<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#8F3D22">
  <title>Sem conexão — Pão Doce</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#F7F2EA;color:#32170E;font-family:system-ui,sans-serif}
    main{width:min(440px,100%);padding:28px;border:1px solid #DDD0C5;border-radius:18px;background:#FFFBF6;text-align:center;box-shadow:0 16px 44px rgba(50,23,14,.12)}
    img{width:76px;height:76px;border-radius:18px}h1{margin:16px 0 8px;font-size:1.55rem}p{margin:0 0 20px;color:#62504A;line-height:1.55}
    button{min-height:44px;padding:10px 16px;border:0;border-radius:10px;background:#8F3D22;color:#FFF9F5;font-weight:700}
  </style>
</head>
<body><main><img src="/pwa-icon.png" alt=""><h1>Você está sem internet.</h1><p>Para proteger os dados, o Pão Doce não mostra pedidos ou pagamentos antigos offline. Reconecte e tente novamente.</p><button type="button" onclick="location.reload()">Tentar novamente</button></main></body>
</html>
